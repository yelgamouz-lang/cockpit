<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Votre cockpit financier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ink:#F4F3F0;--soft:rgba(244,243,240,.78);--mute:rgba(244,243,240,.55);--gold:#B08A55;--gold2:#CDAE80;--champ:#EBD3A6;--line:rgba(205,174,128,.24);--red:#E58579;--green:#74C6A0;--amber:#E6B865;--bg:#07021F;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;min-height:100vh;line-height:1.45;
 background:radial-gradient(1100px 650px at 8% -12%,#2A2079 0%,rgba(42,32,121,0) 62%),radial-gradient(900px 620px at 104% 112%,#1E155C 0%,rgba(30,21,92,0) 60%),linear-gradient(180deg,#0B0633 0%,#05001C 100%);background-attachment:fixed}
.wrap{max-width:1360px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.mono{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid rgba(235,211,166,.6);display:grid;place-items:center;font-family:Cinzel,Georgia,serif;font-size:16px;color:var(--champ);background:linear-gradient(180deg,rgba(235,211,166,.18),rgba(235,211,166,.02));box-shadow:0 0 18px rgba(235,211,166,.15)}
.ht{flex:1 1 320px;min-width:0}
.for{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
h1{font-family:Cinzel,Georgia,serif;font-weight:500;font-size:clamp(22px,3.2vw,32px);letter-spacing:.05em;line-height:1.15;margin-top:4px;text-wrap:balance;background:linear-gradient(180deg,#FFF6DF 0%,#E8CC97 55%,#B48E5B 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.co{font-size:14px;color:var(--soft);margin-top:4px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:7px 13px;border-radius:999px;border:1px solid rgba(205,174,128,.5);color:var(--champ)}
.pill.f{background:rgba(205,174,128,.14)}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:18px 0}
.act .ex{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
.act p{flex:1 1 300px;font-size:clamp(15px,1.8vw,18.5px);font-weight:500;color:#fff;border-left:2px solid var(--gold);padding-left:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
@media (max-width:980px){.s8,.s4,.s6{grid-column:span 12}}
.card{position:relative;border-radius:16px;padding:16px 18px;min-width:0;overflow:hidden;
 background:linear-gradient(180deg,rgba(255,255,255,.078) 0%,rgba(255,255,255,.022) 100%);border:1px solid var(--line);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 26px 50px -26px rgba(0,0,0,.75)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(235,211,166,.6) 50%,transparent 95%)}
.card h2{font-size:11.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--gold2)}
.card .sub{font-size:12.5px;color:var(--mute);margin-top:4px}
.lab{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
.big{font-family:Cinzel,Georgia,serif;font-weight:400;font-size:clamp(32px,3.4vw,42px);line-height:1.1;margin:10px 0 10px;white-space:nowrap;
 background:linear-gradient(180deg,#FFF7E3 0%,#EED6A8 48%,#B99363 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.big small{font-size:.48em;margin-left:6px;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.up{background:rgba(116,198,160,.14);color:#93D6B6}.dn{background:rgba(229,133,121,.16);color:#F2A79C}.neu{background:rgba(230,184,101,.14);color:#EDC982}
.al{border-color:rgba(229,133,121,.45);box-shadow:inset 3px 0 0 rgba(229,133,121,.85),inset 0 1px 0 rgba(255,255,255,.10),0 26px 50px -26px rgba(0,0,0,.75)}
.cv{width:100%;height:320px;margin-top:8px}
.cv.sm{height:260px}
.tw{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
td,th{padding:8px 4px;border-top:1px solid rgba(255,255,255,.08);text-align:left;color:var(--soft)}
th{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-top:0}
td.n,th.n{text-align:right}td.n{color:#fff;font-weight:500}
td.bad{color:#F2A79C;font-weight:600}td.good{color:#93D6B6;font-weight:600}
.sim{background:linear-gradient(160deg,rgba(235,211,166,.16) 0%,rgba(235,211,166,.04) 55%,rgba(255,255,255,.02) 100%);border-color:rgba(235,211,166,.42)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--champ)}
.sim h3{margin-top:6px;color:#fff;font-size:16px;font-weight:600}
.ctl{margin-top:16px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--soft)}
.ctl label strong{color:#fff}
input[type=range]{width:100%;margin:10px 0 4px;accent-color:#E8CC97;height:28px}
.res{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--soft);margin-top:10px;flex-wrap:wrap}
.res .cz{font-family:Cinzel,Georgia,serif;font-size:18px;color:var(--champ)}
.res .bad{color:#F2A79C}.res .good{color:#93D6B6}
.arrow{color:var(--gold2);margin:0 8px;font-weight:600}
.note{border-color:rgba(235,211,166,.42)}
.note ol{margin-top:12px;padding-left:20px;display:grid;gap:10px}
.note li{font-size:14px;color:var(--soft);max-width:75ch}
.note li b{color:#fff;font-weight:600}
.prog{display:grid;gap:12px;margin-top:14px}
.pr{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 48px;gap:10px;align-items:center;font-size:13px;color:var(--soft)}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.10);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#8A6A3E,#F3DDB0)}
.bar i.ok{background:linear-gradient(90deg,#3E8A68,#9EDDBF)}
.pr .v{text-align:right;color:#fff;font-weight:600}
.cta{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;border-color:rgba(235,211,166,.55)}
.cta p{font-size:15px;color:#fff;max-width:70ch}
.cta p span{color:var(--champ)}
.foot{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;font-size:11.5px;color:var(--mute)}
.msg{margin:40px 0;font-size:15px;color:var(--soft)}
.foot b{font-family:Cinzel,Georgia,serif;font-weight:500;color:var(--gold2);letter-spacing:.12em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
"use strict";
/* ---------- Lecture du lien personnel : prénom, métier, secteur ---------- */
function decode(h){
  try{
    h=(h||"").replace(/^#/,"").trim(); if(!h) return null;
    var b=h.replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="=";
    var bin=atob(b), bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){return null;}
}
var P=decode(location.hash)||{};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};
var prenom=(P.p||"").toString().slice(0,40);
var m={cpt:1,cdg:1,tre:1,daf:1}[P.m]?P.m:"daf";
var cur=P.d==="EUR"?"EUR":"MAD";
var app=document.getElementById("app");
app.innerHTML='<p class="msg">Chargement des données du classeur Excel…</p>';

/* ---------- Mise en forme ---------- */
var nf=function(v,d){return new Intl.NumberFormat("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);};
var M=function(v){var a=Math.abs(v);return nf(v,a<10?2:a<100?1:0);};
var pct=function(v,d){return nf(v*100,d==null?1:d)+" %";};
var sum=function(a){return a.reduce(function(x,y){return x+(+y||0);},0);};

/* ---------- ECharts : réglages communs ---------- */
var C={soft:"rgba(244,243,240,.78)",mute:"rgba(244,243,240,.55)",gold:"#CDAE80",champ:"#EBD3A6",green:"#74C6A0",red:"#E58579"};
var AXL={color:C.mute,fontFamily:"Inter",fontSize:11};
var SPL={lineStyle:{color:"rgba(255,255,255,.07)"}};
function LG(c0,c1){return new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:c0},{offset:1,color:c1}]);}
var GOLDV=function(){return LG("#F6E3BC","#9C7A4A");};
var charts=[];
function mk(id,opt){var el=document.getElementById(id);if(!el||!window.echarts)return null;var c=echarts.init(el,null,{renderer:"canvas"});opt.textStyle={fontFamily:"Inter",color:C.soft};opt.animationDuration=900;c.setOption(opt);charts.push(c);return c;}
window.addEventListener("resize",function(){charts.forEach(function(c){c.resize();});});
var U, TT;
function waterfall(id,items,o){
  o=o||{};var el=document.getElementById(id),nar=el&&el.clientWidth<620;
  var base=[],up=[],labels=[],cum=0;
  items.forEach(function(it){
    if(it.t){base.push(0);up.push({value:it.v,itemStyle:{color:GOLDV()}});cum=it.v;}
    else{var nv=cum+it.v;base.push(Math.min(cum,nv));up.push({value:Math.abs(it.v),itemStyle:{color:it.v<0?LG("#F09A8E","#B5544A"):LG("#9EDDBF","#4E9C79")}});cum=nv;}
    labels.push(it.n);
  });
  return mk(id,{grid:{left:nar?26:8,right:8,top:24,bottom:8,containLabel:true},tooltip:{show:false},
    xAxis:{type:"category",data:labels,axisTick:{show:false},axisLine:{lineStyle:{color:"rgba(255,255,255,.18)"}},axisLabel:Object.assign({},AXL,{interval:0,rotate:nar?45:(labels.length>7?30:0),fontSize:nar?10:11,color:C.soft})},
    yAxis:{type:"value",min:o.min,axisLabel:AXL,splitLine:SPL},
    series:[{type:"bar",stack:"w",data:base,itemStyle:{color:"transparent"},emphasis:{disabled:true}},
      {type:"bar",stack:"w",data:up,barWidth:"56%",label:{show:true,position:"top",fontFamily:"Cinzel",fontSize:nar?10:12,color:C.champ,formatter:function(p){var it=items[p.dataIndex];return (it.v>=0?"":"−")+M(Math.abs(it.v));}}}]});
}

/* ---------- Chargement du classeur Excel (à côté de la page) ---------- */
fetch("cockpit-donnees.xlsx",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.arrayBuffer();})
.then(function(buf){
  var wb=XLSX.read(buf,{type:"array"});
  /* Tableaux en liste : clés techniques en ligne 11, données à partir de la ligne 12, colonne C */
  var list=function(n){var ws=wb.Sheets[n];if(!ws)return [];var rg=XLSX.utils.decode_range(ws["!ref"]);rg.s.r=10;rg.s.c=2;return XLSX.utils.sheet_to_json(ws,{range:rg,defval:null});};
  /* Fiches : indicateurs en lignes (clé en colonne D), entreprises en colonnes (codes en ligne 11) */
  var fiche=function(n){var ws=wb.Sheets[n],out={};if(!ws)return out;var rg=XLSX.utils.decode_range(ws["!ref"]);rg.s.r=0;rg.s.c=0;
    var a=XLSX.utils.sheet_to_json(ws,{header:1,range:rg,defval:null}),codes=a[10]||[];
    for(var i=11;i<a.length;i++){var row=a[i];if(!row||!row[3])continue;for(var j=4;j<row.length;j++){var c=codes[j];if(!c)continue;(out[c]=out[c]||{code:c})[row[3]]=row[j];}}
    return out;};
  var par={};list("PARAMETRES").forEach(function(r){if(r&&r.cle)par[r.cle]=r.valeur;});
  var ctl=list("CONTROLES").filter(function(r){return r&&/^C\d/.test(r.code_controle||"");});
  if(!ctl.length||ctl.some(function(r){return r.statut!=="OK";})){app.innerHTML='<p class="msg">Le tableau de bord est en cours de mise à jour. Revenez dans quelques minutes.</p>';return;}
  render(par,list,fiche("SECTEURS"),fiche("CALC_SYNTHESE"));
})
.catch(function(e){app.innerHTML='<p class="msg">Les données du tableau de bord sont momentanément indisponibles. Réessayez dans un instant.</p>';if(window.console)console.error(e);});

function render(par,list,SECS,SYNS){
  var code=SECS[P.s]?P.s:"ind";
  var S=SECS[code], Y=SYNS[code];
  var of=function(name){return list(name).filter(function(r){return r.code===code;});};
  var fx=cur==="EUR"?(+par.facteur_eur||0.1):1;
  var k=fx/1000000;   /* le classeur est en MAD ; la page affiche des millions */
  U=cur==="EUR"?"M€":"M MAD";
  TT={trigger:"axis",backgroundColor:"rgba(13,8,56,.95)",borderColor:"rgba(205,174,128,.45)",textStyle:{color:"#F4F3F0",fontFamily:"Inter",fontSize:12},valueFormatter:function(v){return M(v)+" "+U;}};
  var y=function(key){return (+Y[key]||0)*k;};
  var N=+par.mois_cumul||10, MO=["Janv.","Févr.","Mars","Avr.","Mai","Juin","Juil.","Août","Sept.","Oct.","Nov.","Déc."];
  var moisFin=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][N-1];
  var mens=of("CALC_MENSUEL").sort(function(a,b){return a.mois_num-b.mois_num;});
  var bud=mens.map(function(r){return (+r.budget||0)*k;});
  var real=mens.filter(function(r){return r.mois_num<=N;}).map(function(r){return (+r.reel||0)*k;});
  var CAr=y("ca_reel"),CAb=y("ca_budget_periode"),ecart=CAb?CAr/CAb-1:0;
  var dso=Math.round(+S.dso||0), dpo=Math.round(+S.dpo||0);
  var periode="cumul janvier → "+moisFin+" "+par.exercice;

  var head=function(title,sub){return '<header class="hdr"><div class="mono" aria-hidden="true">AÉ</div><div class="ht"><div class="for">'+(prenom?"Préparé pour "+esc(prenom):"Démonstration")+'</div><h1>'+title+'</h1><div class="co">'+esc(S.entreprise)+' · '+esc(S.secteur)+' · '+sub+'</div></div><div class="pills"><span class="pill f">Entreprise fictive · données simulées</span></div></header>';};
  var kpi=function(lab,val,unit,chip,cls,al){return '<div class="card'+(al?" al":"")+'"><div class="lab">'+lab+'</div><div class="big">'+val+'<small>'+unit+'</small></div><span class="chip '+cls+'">'+chip+'</span></div>';};
  var act=function(t){return '<div class="act"><span class="ex">Message clé</span><p>'+t+'</p></div>';};
  var cta='<div class="card cta"><p>Ce tableau de bord a été construit avec l\'IA et il est relié à un fichier Excel : chaque chiffre vient du classeur. <span>Vous voulez savoir comment construire le vôtre, sur vos propres chiffres ?</span> Répondez à Yassine sur LinkedIn.</p></div>';
  var foot='<footer class="foot"><span>Source : classeur cockpit-donnees.xlsx. '+esc(S.entreprise)+' est une entreprise fictive ; tous les chiffres sont simulés et ne décrivent aucune société réelle.</span><b>L\'ART DE L\'ÉCONOMIE ACADEMY</b></footer>';

  if(m==="daf"){
    var ach=y("achats"),ext=y("charges_externes"),pers=y("personnel"),EB=y("ebitda"),dot=y("dotations"),fi=y("financier"),imp=y("impot"),RN=y("resultat_net"),BFR=y("bfr"),bfrJ=Math.round(+Y.bfr_jours||0),dB=y("var_bfr"),capex=y("investissements"),FCF=y("fcf"),parJour=y("ca_annualise")/365;
    app.innerHTML=head("Cockpit de direction",periode)+
    act("EBITDA de "+M(EB)+" "+U+" ("+pct(EB/CAr)+" du CA), mais "+bfrJ+" jours de chiffre d'affaires restent bloqués dans le BFR.")+
    '<div class="kpis">'+
     kpi("Chiffre d'affaires",M(CAr),U,(ecart>=0?"+":"")+pct(ecart)+" contre le budget",ecart>=0?"up":"dn")+
     kpi("EBITDA",M(EB),U,pct(EB/CAr)+" du chiffre d'affaires","up")+
     kpi("Besoin en fonds de roulement",M(BFR),U,bfrJ+" jours de chiffre d'affaires","dn",true)+
     kpi("Cash disponible (FCF)",M(FCF),U,"après "+M(capex)+" "+U+" d'investissements",FCF>=0?"neu":"dn")+
    '</div><div class="grid">'+
     '<div class="card s8"><h2>Du chiffre d\'affaires au résultat net</h2><div class="sub">Cumul à fin '+moisFin+', en '+U+'</div><div id="c1" class="cv"></div></div>'+
     '<div class="card s4 sim"><div class="tag">Simulateur</div><h3>Et si vos clients payaient plus vite ?</h3>'+
       '<div class="ctl"><label for="r1"><span>Délai client</span><strong id="o1">'+dso+' jours</strong></label><input id="r1" type="range" min="'+Math.max(10,dso-40)+'" max="'+(dso+30)+'" value="'+dso+'"></div>'+
       '<div class="res"><span>BFR</span><span><span class="cz">'+M(BFR)+'</span><span class="arrow">→</span><span class="cz" id="o2">'+M(BFR)+' '+U+'</span></span></div>'+
       '<div class="res"><span>Trésorerie libérée</span><span class="cz" id="o3">0</span></div>'+
       '<div class="res" style="margin-top:16px"><span>Un jour de délai client vaut</span><span class="cz">'+M(parJour)+' '+U+'</span></div></div>'+
     '<div class="card s6"><h2>Chiffre d\'affaires : réel contre budget</h2><div class="sub">Par mois, en '+U+'</div><div id="c2" class="cv sm"></div></div>'+
     '<div class="card s6"><h2>De l\'EBITDA au cash disponible</h2><div class="sub">Où part la performance, en '+U+'</div><div id="c3" class="cv sm"></div></div>'+
     '<div class="card s12 note"><h2>Note au directeur général</h2><div class="sub">Rédigée automatiquement à partir des chiffres du classeur</div><ol>'+
      '<li><b>Activité.</b> Le chiffre d\'affaires atteint '+M(CAr)+' '+U+' à fin '+moisFin+', soit '+pct(CAr/CAb)+' du budget de la période ('+(ecart>=0?"+":"−")+M(Math.abs(CAr-CAb))+' '+U+').</li>'+
      '<li><b>Rentabilité.</b> L\'EBITDA ressort à '+M(EB)+' '+U+', soit '+pct(EB/CAr)+' du chiffre d\'affaires ; le résultat net s\'établit à '+M(RN)+' '+U+'.</li>'+
      '<li><b>Trésorerie.</b> Le BFR immobilise '+bfrJ+' jours de chiffre d\'affaires, avec un délai client de '+dso+' jours. Le cash disponible après investissements est de '+M(FCF)+' '+U+'.</li>'+
      '<li><b>Décision proposée.</b> Réduire le délai client de 10 jours libérerait environ '+M(parJour*10)+' '+U+' de trésorerie, sans un dirham de chiffre d\'affaires en plus.</li></ol></div>'+
    '</div>'+cta+foot;
    waterfall("c1",[{n:"Chiffre d'affaires",v:CAr,t:1},{n:"Achats",v:-ach},{n:"Charges externes",v:-ext},{n:"Personnel",v:-pers},{n:"EBITDA",v:EB,t:1},{n:"Dotations",v:-dot},{n:"Financier",v:-fi},{n:"Impôt",v:-imp},{n:"Résultat net",v:RN,t:1}]);
    mk("c2",{grid:{left:8,right:8,top:30,bottom:8,containLabel:true},tooltip:TT,legend:{top:0,right:0,textStyle:{color:C.soft,fontSize:11},data:["Réel","Budget"]},
     xAxis:{type:"category",data:MO.slice(0,N),axisTick:{show:false},axisLabel:AXL},yAxis:{type:"value",axisLabel:AXL,splitLine:SPL},
     series:[{name:"Réel",type:"bar",data:real,barWidth:"52%",itemStyle:{color:GOLDV(),borderRadius:[4,4,0,0]}},{name:"Budget",type:"line",data:bud.slice(0,N),symbol:"circle",symbolSize:6,lineStyle:{color:"#fff",type:[5,4],width:1.5},itemStyle:{color:"#fff"}}]});
    waterfall("c3",[{n:"EBITDA",v:EB,t:1},{n:"Impôt",v:-imp},{n:"Intérêts",v:-fi},{n:"Hausse du BFR",v:-dB},{n:"Investissements",v:-capex},{n:"Cash disponible",v:FCF,t:1}]);
    var r1=document.getElementById("r1");
    r1.addEventListener("input",function(){var d=+r1.value-dso,nb=BFR+parJour*d;document.getElementById("o1").textContent=r1.value+" jours";document.getElementById("o2").textContent=M(nb)+" "+U;var o3=document.getElementById("o3");o3.textContent=(d<=0?"+":"−")+M(Math.abs(parJour*d))+" "+U;o3.className="cz "+(d<0?"good":d>0?"bad":"");});
  }

  if(m==="cdg"){
    var EBb=y("ebitda_budget"),EBr=y("ebitda"),mb=+Y.mb_reelle,mbB=+S.mb_budget,CAy=y("ca_budget_annuel"),t0=+S.ecart_activite;
    var rest=sum(bud.slice(N));
    var land=function(t){return CAr+rest*(1+t);};
    var cc=of("CALC_CENTRES");
    app.innerHTML=head("Budget contre réel","contrôle de gestion · "+periode)+
    act("Le chiffre d'affaires est à "+pct(CAr/CAb)+" du budget ; l'EBITDA "+(EBr>=EBb?"dépasse":"manque")+" l'objectif de "+M(Math.abs(EBr-EBb))+" "+U+".")+
    '<div class="kpis">'+
     kpi("CA réel",M(CAr),U,(ecart>=0?"+":"")+pct(ecart)+" contre le budget",ecart>=0?"up":"dn")+
     kpi("EBITDA réel",M(EBr),U,(EBr>=EBb?"+":"−")+M(Math.abs(EBr-EBb))+" "+U+" contre le budget",EBr>=EBb?"up":"dn",EBr<EBb)+
     kpi("Marge brute",pct(mb),"","objectif "+pct(mbB),mb>=mbB?"up":"dn")+
     kpi("Atterrissage annuel",M(y("atterrissage")),U,"budget "+M(CAy)+" "+U,"neu")+
    '</div><div class="grid">'+
     '<div class="card s8"><h2>Réel contre budget, mois par mois</h2><div class="sub">Chiffre d\'affaires en '+U+' et écart cumulé</div><div id="c1" class="cv"></div></div>'+
     '<div class="card s4 sim"><div class="tag">Simulateur</div><h3>Où finira l\'année ?</h3>'+
      '<div class="ctl"><label for="r1"><span>Fin d\'année contre budget</span><strong id="o1"></strong></label><input id="r1" type="range" min="-15" max="15" value="'+Math.round(t0*100)+'"></div>'+
      '<div class="res"><span>CA annuel estimé</span><span class="cz" id="o2"></span></div>'+
      '<div class="res"><span>Écart au budget annuel</span><span class="cz" id="o3"></span></div></div>'+
     '<div class="card s6"><h2>Pourquoi l\'EBITDA s\'écarte du budget</h2><div class="sub">Analyse des écarts, en '+U+'</div><div id="c2" class="cv sm"></div></div>'+
     '<div class="card s6"><h2>Centres de coûts sous surveillance</h2><div class="sub">Cumul à fin '+moisFin+', en '+U+'</div><div class="tw"><table><thead><tr><th>Centre</th><th class="n">Budget</th><th class="n">Réel</th><th class="n">Écart</th></tr></thead><tbody>'+
      cc.map(function(c){var e=+c.ecart_pct||0;return '<tr><td>'+esc(c.centre)+'</td><td class="n">'+M(c.budget*k)+'</td><td class="n">'+M(c.reel*k)+'</td><td class="n '+(e>.05?"bad":e<0?"good":"")+'">'+(e>=0?"+":"")+pct(e)+'</td></tr>';}).join("")+
     '</tbody></table></div></div>'+
    '</div>'+cta+foot;
    var cum=0,cumA=real.map(function(r,i){cum+=r-bud[i];return cum;});
    mk("c1",{grid:{left:8,right:8,top:30,bottom:8,containLabel:true},tooltip:TT,legend:{top:0,right:0,textStyle:{color:C.soft,fontSize:11},data:["Réel","Budget","Écart cumulé"]},
     xAxis:{type:"category",data:MO.slice(0,N),axisTick:{show:false},axisLabel:AXL},yAxis:[{type:"value",axisLabel:AXL,splitLine:SPL},{type:"value",axisLabel:AXL,splitLine:{show:false}}],
     series:[{name:"Réel",type:"bar",data:real,barWidth:"34%",itemStyle:{color:GOLDV(),borderRadius:[4,4,0,0]}},{name:"Budget",type:"bar",data:bud.slice(0,N),barWidth:"34%",itemStyle:{color:"rgba(255,255,255,.22)",borderRadius:[4,4,0,0]}},
      {name:"Écart cumulé",type:"line",yAxisIndex:1,data:cumA,symbol:"circle",symbolSize:6,lineStyle:{color:cum>=0?C.green:C.red,width:2},itemStyle:{color:cum>=0?C.green:C.red}}]});
    waterfall("c2",[{n:"EBITDA budget",v:EBb,t:1},{n:"Volume",v:y("effet_volume")},{n:"Prix de vente",v:y("effet_prix")},{n:"Coût matières",v:y("effet_matieres")},{n:"Personnel",v:y("effet_personnel")},{n:"Frais généraux",v:y("effet_fg")},{n:"EBITDA réel",v:EBr,t:1}],{min:Math.floor(Math.min(EBb,EBr)*.85)});
    var r1=document.getElementById("r1");var upd=function(){var t=+r1.value/100,l=land(t),e=CAy?l/CAy-1:0;document.getElementById("o1").textContent=(t>=0?"+":"")+r1.value+" %";document.getElementById("o2").textContent=M(l)+" "+U;var o3=document.getElementById("o3");o3.textContent=(e>=0?"+":"")+pct(e);o3.className="cz "+(e>=0?"good":"bad");};
    r1.addEventListener("input",upd);upd();
  }

  if(m==="tre"){
    var rows=of("CALC_TRESORERIE").sort(function(a,b){return a.semaine-b.semaine;});
    var W=rows.map(function(r){return "S"+r.semaine;}),enc=rows.map(function(r){return r.encaissements*k;}),dec=rows.map(function(r){return -r.decaissements*k;}),bal=rows.map(function(r){return r.solde*k;});
    var C0=y("treso_initiale"),seuil=y("seuil_treso"),minB=Math.min.apply(null,bal),minW=bal.indexOf(minB)+1;
    var simB=function(rt){var bb=C0,mn=Infinity,mw=1;for(var i=0;i<enc.length;i++){bb+=enc[i]*(1-rt)+(i>=4?enc[i-4]*rt:0)+dec[i];if(bb<mn){mn=bb;mw=i+1;}}return [mn,mw];};
    app.innerHTML=head("Trésorerie à 13 semaines","trésorerie · prévision glissante")+
    act("Point bas de "+M(minB)+" "+U+" en semaine "+minW+(minB<seuil?" : sous le seuil de sécurité, il faut agir maintenant.":" : le seuil de sécurité tient, mais la marge est à surveiller."))+
    '<div class="kpis">'+
     kpi("Trésorerie aujourd\'hui",M(C0),U,"seuil de sécurité "+M(seuil)+" "+U,"neu")+
     kpi("Point bas",M(minB),U,"semaine "+minW,minB<seuil?"dn":"up",minB<seuil)+
     kpi("Trésorerie à 13 semaines",M(bal[bal.length-1]),U,(bal[bal.length-1]>=C0?"+":"−")+M(Math.abs(bal[bal.length-1]-C0))+" "+U,bal[bal.length-1]>=C0?"up":"dn")+
     kpi("Délai client",dso,"jours","fournisseurs "+dpo+" jours",dso>dpo?"dn":"up")+
    '</div><div class="grid">'+
     '<div class="card s8"><h2>Solde de trésorerie, semaine par semaine</h2><div class="sub">Encaissements, décaissements et solde, en '+U+'</div><div id="c1" class="cv"></div></div>'+
     '<div class="card s4 sim"><div class="tag">Simulateur</div><h3>Et si les clients payaient en retard ?</h3>'+
      '<div class="ctl"><label for="r1"><span>Encaissements décalés d\'un mois</span><strong id="o1">0 %</strong></label><input id="r1" type="range" min="0" max="40" value="0"></div>'+
      '<div class="res"><span>Point bas</span><span><span class="cz">'+M(minB)+'</span><span class="arrow">→</span><span class="cz" id="o2">'+M(minB)+' '+U+'</span></span></div>'+
      '<div class="res"><span>Semaine du point bas</span><span class="cz" id="o3">S'+minW+'</span></div></div>'+
     '<div class="card s6"><h2>Ce qui sort de la caisse</h2><div class="sub">Décaissements sur 13 semaines, en '+U+'</div><div id="c2" class="cv sm"></div></div>'+
     '<div class="card s6"><h2>Les semaines à surveiller</h2><div class="sub">Solde prévisionnel et marge sur le seuil</div><div class="tw"><table><thead><tr><th>Semaine</th><th class="n">Solde</th><th class="n">Marge sur le seuil</th></tr></thead><tbody>'+
      bal.map(function(v,i){return [i,v];}).sort(function(a,b){return a[1]-b[1];}).slice(0,5).map(function(x){var mg=x[1]-seuil;return '<tr><td>Semaine '+(x[0]+1)+'</td><td class="n">'+M(x[1])+'</td><td class="n '+(mg<0?"bad":"good")+'">'+(mg>=0?"+":"−")+M(Math.abs(mg))+'</td></tr>';}).join("")+
     '</tbody></table></div></div>'+
    '</div>'+cta+foot;
    mk("c1",{grid:{left:8,right:8,top:30,bottom:8,containLabel:true},tooltip:TT,legend:{top:0,right:0,textStyle:{color:C.soft,fontSize:11},data:["Encaissements","Décaissements","Solde"]},
     xAxis:{type:"category",data:W,axisTick:{show:false},axisLabel:AXL},yAxis:{type:"value",axisLabel:AXL,splitLine:SPL},
     series:[{name:"Encaissements",type:"bar",stack:"x",data:enc,barWidth:"46%",itemStyle:{color:LG("#9EDDBF","#3E8A68")}},{name:"Décaissements",type:"bar",stack:"x",data:dec,itemStyle:{color:LG("#B5544A","#F09A8E")}},
      {name:"Solde",type:"line",data:bal,smooth:.3,symbol:"circle",symbolSize:7,lineStyle:{color:C.champ,width:2.5,shadowBlur:10,shadowColor:"rgba(235,211,166,.6)"},itemStyle:{color:C.champ},
       markLine:{symbol:"none",label:{formatter:"Seuil de sécurité",position:"insideStartTop",color:C.red,fontSize:11},lineStyle:{color:C.red,type:[6,4]},data:[{yAxis:seuil}]}}]});
    mk("c2",{tooltip:{trigger:"item",backgroundColor:"rgba(13,8,56,.95)",borderColor:"rgba(205,174,128,.45)",textStyle:{color:"#F4F3F0"},valueFormatter:function(v){return M(v)+" "+U;}},legend:{bottom:0,textStyle:{color:C.soft,fontSize:11}},
     series:[{type:"pie",radius:["45%","70%"],center:["50%","45%"],itemStyle:{borderColor:"#0D0838",borderWidth:2},label:{color:C.soft,formatter:function(p){return pct(p.percent/100,0);}},
      data:[{name:"Fournisseurs",value:sum(rows.map(function(r){return r.fournisseurs*k;})),itemStyle:{color:"#CDAE80"}},{name:"Salaires",value:sum(rows.map(function(r){return r.salaires*k;})),itemStyle:{color:"#7A6BB0"}},{name:"Impôts et taxes",value:sum(rows.map(function(r){return r.impots*k;})),itemStyle:{color:"#E58579"}},{name:"Échéances d'emprunt",value:sum(rows.map(function(r){return r.echeances*k;})),itemStyle:{color:"#74C6A0"}}]}]});
    var r1=document.getElementById("r1");r1.addEventListener("input",function(){var x=simB(+r1.value/100);document.getElementById("o1").textContent=r1.value+" %";var o2=document.getElementById("o2");o2.textContent=M(x[0])+" "+U;o2.className="cz "+(x[0]<seuil?"bad":"good");document.getElementById("o3").textContent="S"+x[1];});
  }

  if(m==="cpt"){
    var cre=y("encours_clients"),o90=y("creances_90"),o60=y("creances_60"),CAa=y("ca_annualise");
    var ag=of("CALC_BALANCE_AGEE").sort(function(a,b){return a.ordre-b.ordre;});
    var cyc=of("CALC_CLOTURE"),avg=sum(cyc.map(function(c){return c.avancement;}))/cyc.length;
    var cl=of("CALC_RETARDS").sort(function(a,b){return b.montant-a.montant;});
    var jj=Math.round(+S.delai_cloture),aj=Math.round(+S.comptes_justifier),ecb=(+S.ecart_bancaire||0)*fx;
    app.innerHTML=head("Clôture du mois et balance âgée","comptabilité · clôture de "+moisFin+" "+par.exercice)+
    act("Clôture à J+"+jj+" pour un objectif de J+5, et "+M(o90)+" "+U+" de créances clients échues depuis plus de 90 jours.")+
    '<div class="kpis">'+
     kpi("Délai de clôture","J+"+jj,"","objectif J+5",jj>5?"dn":"up",jj>5)+
     kpi("Créances échues à plus de 90 jours",M(o90),U,pct(o90/cre)+" de l\'encours clients","dn")+
     kpi("Délai client (DSO)",dso,"jours","encours "+M(cre)+" "+U,"neu")+
     kpi("Comptes à justifier",aj,"","écart bancaire non expliqué : "+nf(ecb,0)+" "+(cur==="EUR"?"€":"MAD"),"neu")+
    '</div><div class="grid">'+
     '<div class="card s8"><h2>Balance âgée clients</h2><div class="sub">Encours par ancienneté, en '+U+'</div><div id="c1" class="cv"></div></div>'+
     '<div class="card s4 sim"><div class="tag">Simulateur</div><h3>Et si on relançait les retards ?</h3>'+
      '<div class="ctl"><label for="r1"><span>Créances de plus de 60 jours récupérées</span><strong id="o1">0 %</strong></label><input id="r1" type="range" min="0" max="80" value="0"></div>'+
      '<div class="res"><span>Trésorerie récupérée</span><span class="cz" id="o2">0</span></div>'+
      '<div class="res"><span>Délai client</span><span><span class="cz">'+dso+'</span><span class="arrow">→</span><span class="cz" id="o3">'+dso+' jours</span></span></div></div>'+
     '<div class="card s6"><h2>Avancement de la clôture</h2><div class="sub">'+pct(avg,0)+' des travaux terminés, par cycle</div><div class="prog">'+
      cyc.map(function(c){var v=Math.round(c.avancement*100);return '<div class="pr"><span>'+esc(c.cycle)+'</span><div class="bar"><i class="'+(v>=100?"ok":"")+'" style="width:'+v+'%"></i></div><span class="v">'+v+' %</span></div>';}).join("")+
     '</div></div>'+
     '<div class="card s6"><h2>Les cinq retards à relancer en premier</h2><div class="sub">Créances échues à plus de 90 jours</div><div class="tw"><table><thead><tr><th>Client</th><th class="n">Montant</th><th class="n">Retard</th></tr></thead><tbody>'+
      cl.map(function(c){return '<tr><td>'+esc(c.client)+'</td><td class="n">'+M(c.montant*k)+' '+U+'</td><td class="n bad">'+c.jours+' j</td></tr>';}).join("")+
     '</tbody></table></div></div>'+
    '</div>'+cta+foot;
    mk("c1",{grid:{left:8,right:8,top:24,bottom:8,containLabel:true},tooltip:TT,
     xAxis:{type:"category",data:ag.map(function(a){return a.tranche;}),axisTick:{show:false},axisLabel:Object.assign({},AXL,{interval:0,color:C.soft})},yAxis:{type:"value",axisLabel:AXL,splitLine:SPL},
     series:[{type:"bar",barWidth:"55%",data:ag.map(function(a,i){return {value:a.montant*k,itemStyle:{borderRadius:[4,4,0,0],color:i===0?LG("#9EDDBF","#3E8A68"):i<3?GOLDV():LG("#F09A8E","#B5544A")}};}),
      label:{show:true,position:"top",fontFamily:"Cinzel",fontSize:12,color:C.champ,formatter:function(p){return M(p.value);}}}]});
    var r1=document.getElementById("r1");r1.addEventListener("input",function(){var r=+r1.value/100,g=o60*r,nd=Math.round((cre-g)/CAa*365);document.getElementById("o1").textContent=r1.value+" %";var o2=document.getElementById("o2");o2.textContent="+"+M(g)+" "+U;o2.className="cz good";document.getElementById("o3").textContent=nd+" jours";});
  }
  document.title=(prenom?prenom+" · ":"")+"Cockpit financier";
}
})();
</script>
</body>
</html>
